name: Test Azure GPT-5.6-SOL

on:
  workflow_dispatch:

jobs:
  azure-test:
    runs-on: ubuntu-latest

    steps:
      - name: Verifica i secret
        env:
          API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          MODEL: ${{ secrets.AZURE_OPENAI_MODEL }}
        run: |
          set -e

          if [ -z "$API_KEY" ]; then
            echo "ERRORE: manca AZURE_OPENAI_API_KEY"
            exit 1
          fi

          if [ -z "$BASE_URL" ]; then
            echo "ERRORE: manca AZURE_OPENAI_BASE_URL"
            exit 1
          fi

          if [ -z "$MODEL" ]; then
            echo "ERRORE: manca AZURE_OPENAI_MODEL"
            exit 1
          fi

          echo "I secret sono presenti."
          echo "Endpoint configurato: $BASE_URL"
          echo "Modello configurato: $MODEL"

      - name: Invia richiesta a Azure
        env:
          API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          MODEL: ${{ secrets.AZURE_OPENAI_MODEL }}
        run: |
          set -e

          URL="${BASE_URL%/}/responses"

          cat > request.json <<EOF
          {
            "model": "$MODEL",
            "input": "Rispondi soltanto: CONNESSIONE OK"
          }
          EOF

          echo "Invio richiesta a Azure..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST "$URL" \
            --header "Content-Type: application/json" \
            --header "api-key: $API_KEY" \
            --data @request.json \
            --output azure-response.json

          echo "Risposta ricevuta:"
          cat azure-response.json
