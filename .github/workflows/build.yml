name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepara ed esegui Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Compila APK di Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Carica APK pronto per il download
        uses: actions/upload-artifact@v4
        with:
          name: OnePiecePlayer-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
