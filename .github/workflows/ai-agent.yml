name: AI Agent con GPT-5.6-SOL (Azure Foundry)

on:
  workflow_dispatch:

  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '/ai')
      )

    steps:
      - uses: actions/checkout@v4

      - name: Chiama Azure OpenAI (GPT-5.6-SOL) - test connessione
        id: call_azure
        run: |
          RESPONSE=$(curl -s -X POST "${AZURE_OPENAI_BASE_URL}responses" \
            -H "Content-Type: application/json" \
            -H "api-key: ${AZURE_OPENAI_API_KEY}" \
            -d '{
                  "model": "'"${AZURE_OPENAI_MODEL}"'",
                  "input": "Rispondi con una sola frase: la connessione funziona correttamente."
                }')
          echo "$RESPONSE" > azure_response.json
          echo "RISPOSTA GREZZA:"
          cat azure_response.json
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_MODEL: ${{ secrets.AZURE_OPENAI_MODEL }}

      - name: Estrai testo risposta
        id: extract
        run: |
          TEXT=$(cat azure_response.json | python3 -c "
import json,sys
try:
    data = json.load(sys.stdin)
    text = ''
    if 'output' in data:
        for item in data['output']:
            if 'content' in item:
                for c in item['content']:
                    if 'text' in c:
                        text += c['text']
    elif 'output_text' in data:
        text = data['output_text']
    else:
        text = json.dumps(data)[:500]
    print(text)
except Exception as e:
    print('Errore nel leggere la risposta: ' + str(e))
")
          echo "testo<<EOF" >> $GITHUB_OUTPUT
          echo "$TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commenta sull'issue con il risultato
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const testo = `${{ steps.extract.outputs.testo }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Risposta da GPT-5.6-SOL:

" + testo
            });
