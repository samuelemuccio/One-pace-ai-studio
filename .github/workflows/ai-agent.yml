name: Test Azure GPT-5.6-SOL

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  test-azure:
    runs-on: ubuntu-latest

    steps:
      - name: Verifica variabili
        shell: bash
        env:
          API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          MODEL: ${{ secrets.AZURE_OPENAI_MODEL }}
        run: |
          set -e

          if [ -z "$API_KEY" ]; then
            echo "ERRORE: secret AZURE_OPENAI_API_KEY mancante"
            exit 1
          fi

          if [ -z "$BASE_URL" ]; then
            echo "ERRORE: secret AZURE_OPENAI_BASE_URL mancante"
            exit 1
          fi

          if [ -z "$MODEL" ]; then
            echo "ERRORE: secret AZURE_OPENAI_MODEL mancante"
            exit 1
          fi

          echo "I tre secret esistono."
          echo "Endpoint configurato: $BASE_URL"
          echo "Modello configurato: $MODEL"

      - name: Chiama Azure OpenAI
        shell: bash
        env:
          API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          MODEL: ${{ secrets.AZURE_OPENAI_MODEL }}
        run: |
          set -e

          URL="${BASE_URL%/}/responses"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST "$URL" \
            --header "Content-Type: application/json" \
            --header "api-key: $API_KEY" \
            --data "$(printf '{"model":"%s","input":"Rispondi soltanto: CONNESSIONE OK"}' "$MODEL")" \
            --output azure-response.json

          echo "Risposta ricevuta da Azure:"
          cat azure-response.json

      - name: Rispondi all'issue
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const risposta = fs.readFileSync("azure-response.json", "utf8");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ Azure ha risposto:

```json
" +
                risposta.slice(0, 6000) +
                "
```"
            });
